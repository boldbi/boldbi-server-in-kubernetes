{{- if .Values.upgradeCenter.enabled }}
{{- $integrationMode := trim (default "IdpIntegrated" .Values.upgradeCenter.integrationMode) }}
{{- if not (has (lower $integrationMode) (list "idpintegrated" "standalone")) }}
{{- fail "upgradeCenter.integrationMode must be IdpIntegrated or Standalone." }}
{{- end }}
{{- $isStandalone := eq (lower $integrationMode) "standalone" }}
{{- $storage := include "boldbi.upgradeCenter.storage" . | fromYaml }}
{{- $usesFiles := and $isStandalone (eq $storage.source "FileSystem") }}
{{- $hasRealPV := or
    .Values.persistentVolume.useExistingClaim
    (and (eq .Values.clusterProvider "onpremise")
      (ne (default "" .Values.persistentVolume.onpremise.hostPath) ""))
    (and (eq .Values.clusterProvider "aks")
      (or (ne (default "" .Values.persistentVolume.aks.nfs.fileShareName) "")
       (ne (default "" .Values.persistentVolume.aks.fileShareName) "")))
    (and (eq .Values.clusterProvider "eks")
      (ne (default "" .Values.persistentVolume.eks.efsFileSystemId) ""))
    (and (eq .Values.clusterProvider "gke")
      (and (ne (default "" .Values.persistentVolume.gke.fileShareIp) "")
        (ne (default "" .Values.persistentVolume.gke.fileShareName) "")))
    (and (eq .Values.clusterProvider "ack")
      (ne (default "" .Values.persistentVolume.ack.serverName) ""))
    (and (eq .Values.clusterProvider "oke")
      (or (ne (default "" .Values.persistentVolume.oke.volumeHandle) "")
       (and .Values.persistentVolume.oke.blockVolume.blockVolumeEnable
         (ne (default "" .Values.persistentVolume.oke.blockVolume.blockVolumeCapacity) ""))))
}}
{{- if and $usesFiles (not $hasRealPV) }}
{{- fail "Filesystem Standalone Upgrade Center requires the product App_Data PVC. Configure persistentVolume for your cluster or set persistentVolume.useExistingClaim and claimName." }}
{{- end }}
{{- /* IdpIntegrated without a PV or object storage keeps its own data on an ephemeral emptyDir. */ -}}
{{- $ephemeral := and (not $hasRealPV) (eq $storage.source "FileSystem") }}
{{- if and $usesFiles .Values.persistentVolume.useExistingClaim (empty .Values.persistentVolume.claimName) }}
{{- fail "persistentVolume.claimName is required when Standalone Upgrade Center uses an existing claim." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bold-upgrade-center
{{ include "boldbi.namespace" . | indent 2 }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}_{{ .Chart.Version }}
    app.kubernetes.io/name: bold-upgrade-center
    app.kubernetes.io/instance: {{ .Release.Name }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bold-upgrade-center
{{ include "boldbi.namespace" . | indent 2 }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}_{{ .Chart.Version }}
    app.kubernetes.io/name: bold-upgrade-center
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bold-upgrade-center
{{ include "boldbi.namespace" . | indent 2 }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}_{{ .Chart.Version }}
    app.kubernetes.io/name: bold-upgrade-center
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: bold-upgrade-center
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bold-upgrade-center
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bold-upgrade-center-config
{{ include "boldbi.namespace" . | indent 2 }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}_{{ .Chart.Version }}
    app.kubernetes.io/name: bold-upgrade-center
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Chart.AppVersion }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  integrationMode: {{ $integrationMode | quote }}
  deploymentMode: "BoldBI"
  biReleaseVersionsApiUrl: "https://releases.boldbi.com/version/json"
  idpApi: "http://id-api-service:6001/api"
  ums: "http://id-ums-service:6002/ums"
  allowedForwardedPrefix0: "/upgrade-center"
  playwrightJobTimeoutSeconds: "9000"
  playwrightCleanupJobTimeoutSeconds: "900"
  playwrightCompletedJobTtlSeconds: "3600"
  biPlaywrightWorkers: "1"
  playwrightJobCpuRequest: "1"
  playwrightJobCpuLimit: "2"
  playwrightJobMemoryRequest: "2Gi"
  playwrightJobMemoryLimit: "4Gi"
  playwrightSharedStateVolumeEnabled: "true"
  playwrightSharedStateStorageClassName: ""
  playwrightSharedStateStorageSize: "1Gi"
  playwrightSharedStateAccessMode: "ReadWriteOnce"
  playwrightSharedStateMountPath: "/app/playwright-shared-state"
  playwrightSharedStateFsGroup: "1001"
  playwrightPodHoldSeconds: "10"
  biPlaywrightPassRateThreshold: "100"
  playwrightReportUploadBaseUrl: "http://bold-upgrade-center/upgrade-center/api/playwright-reports"
  playwrightResultUploadBaseUrl: "http://bold-upgrade-center/upgrade-center/api/playwright-results"
  productHealthCheckEnabled: "true"
  productHealthCheckTimeoutSeconds: "300"
  productHealthCheckPollSeconds: "10"
  productHealthCheckRequestTimeoutSeconds: "10"
  kubernetesSkipTlsVerify: "false"
  kubernetesAllowSkipTlsVerifyForLocalDevelopment: "false"
  kubernetesCertificateAuthorityPath: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  allowedImageRepository0: "us-docker.pkg.dev/boldbi-294612/boldbi"
  allowedImageRepository2: {{ .Values.image.repo | quote }}
  allowedImageRegistryHost0: "us-docker.pkg.dev"
  allowedImageRepository1: "syncfusion"
  allowedImageRegistryHost1: "docker.io"
  reportRetentionJobCount: "14"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bold-upgrade-center
{{ include "boldbi.namespace" . | indent 2 }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}_{{ .Chart.Version }}
    app.kubernetes.io/name: bold-upgrade-center
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Chart.AppVersion }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bold-upgrade-center
      # app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- if and (or $isStandalone (not $hasRealPV)) (ne $storage.source "FileSystem") }}
      annotations:
        checksum/upgrade-center-storage: {{ $storage.credentials | toJson | sha256sum }}
      {{- end }}
      labels:
        app.kubernetes.io/name: bold-upgrade-center
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: bold-upgrade-center
      automountServiceAccountToken: true
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- if kindIs "string" .Values.imagePullSecrets }}
      - name: {{ .Values.imagePullSecrets }}
      {{- else }}
      {{- range .Values.imagePullSecrets }}
      - name: {{ if kindIs "map" . }}{{ .name }}{{ else }}{{ . }}{{ end }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if not $isStandalone }}
      initContainers:
        - name: wait-for-idp-configuration
          image: docker.io/curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          env:
            - name: IDP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: idpApi
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              configuration_url="${IDP_API_URL%/}/configuration"
              timeout_seconds=300
              poll_interval_seconds=30
              start_time="$(date +%s)"

              while true; do
                elapsed_seconds=$(($(date +%s) - start_time))
                echo "Checking IDP configuration endpoint. Elapsed ${elapsed_seconds}/${timeout_seconds} seconds."
                response_file="$(mktemp)"
                status_code="$(curl -sS -o "$response_file" -w "%{http_code}" --connect-timeout 5 --max-time 10 "$configuration_url" || true)"
                response_bytes="$(wc -c < "$response_file" | tr -d ' ')"

                if [ "$status_code" = "200" ] && [ "$response_bytes" -gt 0 ]; then
                  echo "IDP configuration endpoint returned a response. Status: ${status_code}. ResponseBytes: ${response_bytes}."
                  rm -f "$response_file"
                  exit 0
                fi

                echo "IDP configuration endpoint is not ready. Status: ${status_code:-request_failed}. ResponseBytes: ${response_bytes}."
                rm -f "$response_file"

                elapsed_seconds=$(($(date +%s) - start_time))
                if [ "$elapsed_seconds" -ge "$timeout_seconds" ]; then
                  break
                fi

                remaining_seconds=$((timeout_seconds - elapsed_seconds))
                sleep_seconds="$poll_interval_seconds"
                if [ "$remaining_seconds" -lt "$poll_interval_seconds" ]; then
                  sleep_seconds="$remaining_seconds"
                fi

                echo "Waiting ${sleep_seconds} seconds before retry."
                sleep "$sleep_seconds"
              done

              echo "IDP configuration endpoint did not return a usable response within ${timeout_seconds} seconds."
              exit 1
      {{- end }}
      containers:
        - name: bold-upgrade-center
          image: "{{ .Values.upgradeCenter.image.repo }}:{{ .Values.upgradeCenter.image.tag }}"
          imagePullPolicy: {{ .Values.upgradeCenter.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            {{- if and (or $isStandalone (not $hasRealPV)) (ne $storage.source "FileSystem") }}
            - secretRef:
                name: bold-upgrade-center-storage
            {{- end }}
            - secretRef:
                name: bold-upgrade-center-playwright
                optional: true
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: UpgradeCenter__IntegrationMode
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: integrationMode
            - name: BOLD_SERVICES_PV_USED
              value: {{ or $hasRealPV $ephemeral | quote }}
            {{- if or $isStandalone (not $hasRealPV) }}
            {{- if not $usesFiles }}
            {{- range $name, $value := $storage.environment }}
            {{- if ne (toString $value) "" }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $usesFiles }}
            - name: UpgradeCenter__Configuration__ConfigFilePath
              value: "/app/app_data/configuration/config.json"
            - name: UpgradeCenter__Configuration__PrivateKeyFilePath
              value: "/app/app_data/configuration/privatekeys.dat"
            {{- end }}
            - name: UpgradeCenter__DeploymentMode
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: deploymentMode
            - name: UpgradeCenter__BiReleaseVersionsApiUrl
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: biReleaseVersionsApiUrl
            - name: UpgradeCenter__Services__IdpApi
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: idpApi
            - name: UpgradeCenter__Services__Ums
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: ums
            - name: UpgradeCenter__Authentication__AllowedForwardedPrefixes__0
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: allowedForwardedPrefix0
            - name: UpgradeCenter__Playwright__UseKubernetesJob
              value: "true"
            - name: UpgradeCenter__Playwright__JobTimeoutSeconds
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightJobTimeoutSeconds
            - name: UpgradeCenter__Playwright__CleanupJobTimeoutSeconds
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightCleanupJobTimeoutSeconds
            - name: UpgradeCenter__Playwright__CompletedJobTtlSeconds
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightCompletedJobTtlSeconds
            - name: BOLDBI_PLAYWRIGHT_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: biPlaywrightWorkers
            - name: UpgradeCenter__Playwright__JobCpuRequest
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightJobCpuRequest
            - name: UpgradeCenter__Playwright__JobCpuLimit
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightJobCpuLimit
            - name: UpgradeCenter__Playwright__JobMemoryRequest
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightJobMemoryRequest
            - name: UpgradeCenter__Playwright__JobMemoryLimit
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightJobMemoryLimit
            - name: UpgradeCenter__Playwright__SharedStateVolumeEnabled
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightSharedStateVolumeEnabled
            - name: UpgradeCenter__Playwright__SharedStateStorageClassName
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightSharedStateStorageClassName
            - name: UpgradeCenter__Playwright__SharedStateStorageSize
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightSharedStateStorageSize
            - name: UpgradeCenter__Playwright__SharedStateAccessMode
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightSharedStateAccessMode
            - name: UpgradeCenter__Playwright__SharedStateMountPath
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightSharedStateMountPath
            - name: UpgradeCenter__Playwright__SharedStateFsGroup
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightSharedStateFsGroup
            - name: PLAYWRIGHT_POD_HOLD_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightPodHoldSeconds
            - name: BOLDBI_PLAYWRIGHT_PASS_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: biPlaywrightPassRateThreshold
            - name: UpgradeCenter__Playwright__ReportUploadBaseUrl
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightReportUploadBaseUrl
            - name: UpgradeCenter__Playwright__ResultUploadBaseUrl
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: playwrightResultUploadBaseUrl
            - name: UpgradeCenter__ProductHealthCheck__Enabled
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: productHealthCheckEnabled
            - name: UpgradeCenter__ProductHealthCheck__TimeoutSeconds
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: productHealthCheckTimeoutSeconds
            - name: UpgradeCenter__ProductHealthCheck__PollSeconds
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: productHealthCheckPollSeconds
            - name: UpgradeCenter__ProductHealthCheck__RequestTimeoutSeconds
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: productHealthCheckRequestTimeoutSeconds
            - name: UpgradeCenter__Kubernetes__SkipTlsVerify
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: kubernetesSkipTlsVerify
            - name: UpgradeCenter__Kubernetes__AllowSkipTlsVerifyForLocalDevelopment
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: kubernetesAllowSkipTlsVerifyForLocalDevelopment
            - name: UpgradeCenter__Kubernetes__CertificateAuthorityPath
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: kubernetesCertificateAuthorityPath
            - name: UpgradeCenter__Kubernetes__AllowedImageRepositories__0
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: allowedImageRepository0
            - name: UpgradeCenter__Kubernetes__AllowedImageRepositories__2
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: allowedImageRepository2
            - name: UpgradeCenter__Kubernetes__AllowedImageRegistryHosts__0
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: allowedImageRegistryHost0
            - name: UpgradeCenter__Kubernetes__AllowedImageRepositories__1
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: allowedImageRepository1
            - name: UpgradeCenter__Kubernetes__AllowedImageRegistryHosts__1
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: allowedImageRegistryHost1
            - name: UpgradeCenter__Playwright__ReportRetentionJobCount
              valueFrom:
                configMapKeyRef:
                  name: bold-upgrade-center-config
                  key: reportRetentionJobCount  
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          readinessProbe:
            httpGet:
              path: /upgrade-center/health-check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /upgrade-center/health-check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.upgradeCenter.resources.requests.cpu }}
              memory: {{ .Values.upgradeCenter.resources.requests.memory }}
            limits:
              cpu: {{ .Values.upgradeCenter.resources.limits.cpu }}
              memory: {{ .Values.upgradeCenter.resources.limits.memory }}
          volumeMounts:
            {{- if $usesFiles }}
            - name: product-app-data
              mountPath: /app/app_data
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - mountPath: /app/App_Data
              name: upgrade-center-volume
      volumes:
        {{- if $usesFiles }}
        - name: product-app-data
          persistentVolumeClaim:
            {{- if .Values.persistentVolume.useExistingClaim }}
            claimName: {{ .Values.persistentVolume.claimName }}
            {{- else }}
            claimName: {{ printf "%s-claim" .Values.persistentVolume.name }}
            {{- end }}
            readOnly: true
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: upgrade-center-volume
          {{- if $hasRealPV }}
          persistentVolumeClaim:
            {{- if $.Values.persistentVolume.useExistingClaim }}
            claimName: {{ $.Values.persistentVolume.claimName }}
            {{- else }}
            claimName: {{ printf "%s-claim" $.Values.persistentVolume.name }}
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- if .Values.tolerationEnable }}
      tolerations:
      {{- range .Values.tolerations }}
        - key: {{ .key }}
          operator: {{ .operator }}
          value: {{ .value }}
          effect: {{ .effect }}
      {{- end }}
      {{- end }}
      {{- if .Values.nodeAffinityEnable }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.nodeAffinity.key }}
                    operator: {{ .Values.nodeAffinity.operator }}
                    values:
                      - {{ .Values.nodeAffinity.value }}
      {{- end }}
{{- end }}
