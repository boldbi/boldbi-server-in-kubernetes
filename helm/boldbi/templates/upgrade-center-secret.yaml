{{- if .Values.upgradeCenter.enabled }}
{{- $sharedAdminUsername := default .Values.upgradeCenter.secret.adminUsername .Values.rootUserDetails.email }}
{{- $sharedAdminPassword := default .Values.upgradeCenter.secret.adminPassword .Values.rootUserDetails.password }}
{{- if and (eq (lower (trim (default "IdpIntegrated" .Values.upgradeCenter.integrationMode))) "standalone") (or (empty $sharedAdminUsername) (empty $sharedAdminPassword)) }}
{{- fail "Standalone Upgrade Center requires administrator credentials in rootUserDetails or upgradeCenter.secret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: bold-upgrade-center-playwright
  {{- include "boldbi.namespace" . | nindent 2 }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}_{{ .Chart.Version }}
    app.kubernetes.io/name: bold-upgrade-center-playwright
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Chart.AppVersion }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  BOLD_ADMIN_USERNAME: {{ $sharedAdminUsername | quote }}
  BOLD_ADMIN_PASSWORD: {{ $sharedAdminPassword | quote }}
{{- end }}
