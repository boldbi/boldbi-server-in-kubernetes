{{- $hasRealPV := or
    $.Values.persistentVolume.useExistingClaim
    (and (eq $.Values.clusterProvider "onpremise")
         (ne (default "" $.Values.persistentVolume.onpremise.hostPath) ""))
    (and (eq $.Values.clusterProvider "aks")
         (or (ne (default "" $.Values.persistentVolume.aks.nfs.fileShareName) "")
             (ne (default "" $.Values.persistentVolume.aks.fileShareName) "")))
    (and (eq $.Values.clusterProvider "eks")
         (ne (default "" $.Values.persistentVolume.eks.efsFileSystemId) ""))
    (and (eq $.Values.clusterProvider "gke")
         (and (ne (default "" $.Values.persistentVolume.gke.fileShareIp) "")
              (ne (default "" $.Values.persistentVolume.gke.fileShareName) "")))
    (and (eq $.Values.clusterProvider "ack")
         (ne (default "" $.Values.persistentVolume.ack.serverName) ""))
    (and (eq $.Values.clusterProvider "oke")
         (or (ne (default "" $.Values.persistentVolume.oke.volumeHandle) "")
             (and $.Values.persistentVolume.oke.blockVolume.blockVolumeEnable
                  (ne (default "" $.Values.persistentVolume.oke.blockVolume.blockVolumeCapacity) ""))))
-}}
{{- if $hasRealPV }}
{{- if not .Values.persistentVolume.useExistingClaim }}
{{- if or (eq .Values.clusterProvider "eks") (eq .Values.clusterProvider "onpremise") ( .Values.persistentVolume.aks.nfs.fileShareName  ) (and .Values.persistentVolume.oke.blockVolume.blockVolumeEnable (not .Values.persistentVolume.oke.blockVolume.storageClassExists)) }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  labels:
    {{- include "boldbi.labels" . | nindent 4 }}
  {{- if eq .Values.clusterProvider "eks" }}
  name: {{ default "efs-sc" .Values.persistentVolume.eks.storageClass }}
  {{- else if eq .Values.clusterProvider "aks" }}
  name: {{ default "azurefile-csi-nfs" .Values.persistentVolume.aks.nfs.storageClass }} 
  {{- else if eq .Values.clusterProvider "onpremise" }}
  name: bold-storageclass
  {{- else if and (.Values.persistentVolume.oke.blockVolume.blockVolumeEnable) (.Values.persistentVolume.oke.blockVolume.blockVolumeStorageClass) }}
  name: {{ .Values.persistentVolume.oke.blockVolume.blockVolumeStorageClass }}
  {{- else if .Values.persistentVolume.oke.blockVolume.blockVolumeEnable }}
  name: bold-storageclass
  {{- end }}
  {{- if eq .Release.Namespace "default" }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
{{- if eq .Values.clusterProvider "eks" }}
provisioner: efs.csi.aws.com
{{- else if eq .Values.clusterProvider "aks" }}
provisioner: file.csi.azure.com
{{- else if eq .Values.clusterProvider "onpremise" }}
provisioner: kubernetes.io/no-provisioner
{{- else if .Values.persistentVolume.oke.blockVolume.blockVolumeEnable }}
provisioner: blockvolume.csi.oraclecloud.com
reclaimPolicy: {{ .Values.persistentVolume.oke.blockVolume.blockVolumeReclimPolicy }}
{{- end }}
{{- if eq .Values.clusterProvider "onpremise" }}
volumeBindingMode: WaitForFirstConsumer
{{- end }}
{{- if eq .Values.clusterProvider "aks" }}
allowVolumeExpansion: true
{{- end }}
{{- if eq .Values.clusterProvider "aks" }}
parameters:
  protocol: nfs
{{- if eq .Values.persistentVolume.aks.nfs.secureTransferRequired true }}
  encryptInTransit: {{ "true" | quote }}
{{- end }}
mountOptions:
  - nconnect=4
{{- if eq .Values.persistentVolume.aks.nfs.secureTransferRequired true }}
  - noresvport
  - actimeo=30
{{- end }}
{{- else if .Values.persistentVolume.oke.blockVolume.blockVolumeEnable }}
parameters:
  type: "oci-bv"
{{- else if and (eq .Values.clusterProvider "eks") (.Values.persistentVolume.eks.efsAccessPointId) }}
parameters:
  fileSystemId: {{ .Values.persistentVolume.eks.efsFileSystemId }}
  directoryPerms: "0777"
{{- end }}
---
{{ end }}
{{- if and (eq .Values.clusterProvider "aks") (.Values.persistentVolume.aks.fileShareName) (.Values.persistentVolume.aks.azureStorageAccountName) (.Values.persistentVolume.aks.azureStorageAccountKey) }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "boldbi.labels" . | nindent 4 }}
  {{- if .Values.persistentVolume.aks.secretName }}
  name: {{ .Values.persistentVolume.aks.secretName }}
  {{- else }}
  name: bold-azure-secret
  {{- end }}
  {{- if eq .Release.Namespace "default" }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
type: Opaque
data:
  azurestorageaccountname: {{ .Values.persistentVolume.aks.azureStorageAccountName }}
  azurestorageaccountkey: {{ .Values.persistentVolume.aks.azureStorageAccountKey }}
---
{{ end }}
{{- if not .Values.persistentVolume.oke.blockVolume.blockVolumeEnable }}
apiVersion: v1
kind: PersistentVolume
metadata:
 labels:
    {{- include "boldbi.labels" . | nindent 4 }}
 name: {{ .Values.persistentVolume.name }}
 {{- if eq .Release.Namespace "default" }}
 namespace: {{ .Values.namespace }}
 {{- else }}
 namespace: {{ .Release.Namespace }}
 {{- end }}
 {{- if eq .Values.clusterProvider "ack" }}
 labels:
    alicloud-pvname: bold-fileserver
 {{- end }}
spec:
 capacity:
   storage: {{ .Values.persistentVolume.capacity }}
 accessModes:
 - ReadWriteMany
 {{- if or (eq .Values.clusterProvider "eks") (eq .Values.clusterProvider "aks") (eq .Values.clusterProvider "oke") }}
 persistentVolumeReclaimPolicy: Retain
 {{- end }}
 {{- if eq .Values.clusterProvider "onpremise" }}
 storageClassName: bold-storageclass
 hostPath:
   path: "{{ .Values.persistentVolume.onpremise.hostPath }}"
 {{- else if eq .Values.clusterProvider "eks" }}
 storageClassName: {{ default "efs-sc" .Values.persistentVolume.eks.storageClass }}
 csi:
   driver: efs.csi.aws.com
   volumeHandle: {{ .Values.persistentVolume.eks.efsFileSystemId }}{{- if .Values.persistentVolume.eks.efsAccessPointId }}::{{ .Values.persistentVolume.eks.efsAccessPointId }}{{- end }}
{{- if and (eq .Values.clusterProvider "eks") (.Values.persistentVolume.eks.efsAccessPointId) }}
 mountOptions:
  - rw
  - vers=4.1
{{- end }}
{{- else if and (eq .Values.clusterProvider "aks") ( .Values.persistentVolume.aks.nfs.fileShareName ) }}
{{- if eq .Values.persistentVolume.aks.nfs.secureTransferRequired false }}
 storageClassName: azurefile-csi-nfs
 nfs:
   path: /{{ .Values.persistentVolume.aks.nfs.fileShareName }}
   server: {{ .Values.persistentVolume.aks.nfs.hostName }}
{{- else }}
 {{- $nfsFileShareValue := trimPrefix "/" .Values.persistentVolume.aks.nfs.fileShareName }}
 {{- $nfsPathParts := splitList "/" $nfsFileShareValue }}
 {{- $nfsStorageAccount := default "" .Values.persistentVolume.aks.nfs.storageAccount }}
 {{- $nfsShareName := $nfsFileShareValue }}
 {{- if eq (len $nfsPathParts) 2 }}
 {{- if eq $nfsStorageAccount "" }}
 {{- $nfsStorageAccount = index $nfsPathParts 0 }}
 {{- end }}
 {{- $nfsShareName = index $nfsPathParts 1 }}
 {{- end }}
 {{- $nfsResourceGroup := required "persistentVolume.aks.nfs.resourceGroup is required for an AKS NFS CSI volume" .Values.persistentVolume.aks.nfs.resourceGroup }}
 {{- $nfsStorageAccount = required "persistentVolume.aks.nfs.storageAccount is required (or use storageaccount/share in fileShareName)" $nfsStorageAccount }}
 storageClassName: {{ default "azurefile-csi-nfs" .Values.persistentVolume.aks.nfs.storageClass }}
 mountOptions:
  - nconnect=4
  - noresvport
  - actimeo=30
 csi:
  driver: file.csi.azure.com
  readOnly: false
  volumeHandle: {{ printf "%s#%s#%s" $nfsResourceGroup $nfsStorageAccount $nfsShareName | quote }}
  volumeAttributes:
   resourceGroup: {{ $nfsResourceGroup | quote }}
   storageAccount: {{ $nfsStorageAccount | quote }}
   shareName: {{ $nfsShareName | quote }}
   protocol: "nfs"
   encryptInTransit: {{ .Values.persistentVolume.aks.nfs.encryptInTransit | quote }}
   mountPermissions: "0777"
   {{ with .Values.persistentVolume.aks.nfs.subscriptionID }}
   subscriptionID: {{ . | quote }}
   {{ end }}
{{- end }}
 {{- else if and (eq .Values.clusterProvider "aks") ( .Values.persistentVolume.aks.fileShareName ) }}
 storageClassName: azurefile
 azureFile:
   {{- if .Values.persistentVolume.aks.secretName }}
   secretName: {{ .Values.persistentVolume.aks.secretName }}
   {{- else }}
   secretName: bold-azure-secret
   {{- end }}
   shareName: {{ .Values.persistentVolume.aks.fileShareName }}
   readOnly: false 
 {{- else if eq .Values.clusterProvider "gke" }}
 nfs:
   path: /{{ .Values.persistentVolume.gke.fileShareName }}
   server: {{ .Values.persistentVolume.gke.fileShareIp }}
 {{- else if eq .Values.clusterProvider "oke" }}
 volumeMode: {{ .Values.persistentVolume.oke.volumeMode | default "FileSystem" }}
 csi:
    driver: fss.csi.oraclecloud.com
    volumeHandle: {{ .Values.persistentVolume.oke.volumeHandle }}
 {{- else if eq .Values.clusterProvider "ack" }}
 csi:
   driver: nasplugin.csi.alibabacloud.com
   volumeHandle: bold-fileserver
   volumeAttributes:
     server: "{{ .Values.persistentVolume.ack.serverName }}"
     path: "{{ .Values.persistentVolume.ack.filePath }}"
 mountOptions:
 - nolock,tcp,noresvport
 - vers=3
 {{- end }}
---
{{ end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
 labels:
    {{- include "boldbi.labels" . | nindent 4 }}
 name: {{ .Values.persistentVolume.name }}-claim
 {{- if eq .Release.Namespace "default" }}
 namespace: {{ .Values.namespace }}
 {{- else }}
 namespace: {{ .Release.Namespace }}
 {{- end }}
spec:
 {{- if not .Values.persistentVolume.oke.blockVolume.blockVolumeEnable }}
 accessModes:
 - ReadWriteMany
 {{- else }}
 accessModes:
 - {{ .Values.persistentVolume.oke.blockVolume.blockVolumeAccessModes | default "ReadWriteOnce" }}
 {{- end }}
 {{- if eq .Values.clusterProvider "onpremise" }}
 storageClassName: bold-storageclass
 {{- else if eq .Values.clusterProvider "eks" }}
 storageClassName: {{ default "efs-sc" .Values.persistentVolume.eks.storageClass }}
 {{- else if and (eq .Values.clusterProvider "aks") ( .Values.persistentVolume.aks.nfs.fileShareName ) }}
 storageClassName: {{ default "azurefile-csi-nfs" .Values.persistentVolume.aks.nfs.storageClass }}
 {{- else if and (eq .Values.clusterProvider "aks") ( .Values.persistentVolume.aks.fileShareName ) }}
 storageClassName: azurefile
 {{- else if eq .Values.clusterProvider "gke" }}
 storageClassName: ""
 {{- else if and (.Values.persistentVolume.oke.blockVolume.blockVolumeEnable) (.Values.persistentVolume.oke.blockVolume.blockVolumeStorageClass) (eq .Values.clusterProvider "oke") }}
 storageClassName: {{ .Values.persistentVolume.oke.blockVolume.blockVolumeStorageClass }}
 {{- else if and (.Values.persistentVolume.oke.blockVolume.blockVolumeEnable) (eq .Values.clusterProvider "oke") }}
 storageClassName: bold-storageclass
 {{- else if eq .Values.clusterProvider "oke" }}
 storageClassName: ""
 {{- end }}
 {{- if not .Values.persistentVolume.oke.blockVolume.blockVolumeEnable }}
 volumeName: {{ .Values.persistentVolume.name }} 
 {{- else if .Values.persistentVolume.oke.blockVolume.blockVolumeName }}
 volumeName: {{ .Values.persistentVolume.oke.blockVolume.blockVolumeName }}
 {{- end }} 
 resources:
   requests:
     {{- if not .Values.persistentVolume.oke.blockVolume.blockVolumeEnable }}
     storage: {{ .Values.persistentVolume.capacity }}
     {{- else }}
     storage: {{ .Values.persistentVolume.oke.blockVolume.blockVolumeCapacity }}
     {{- end }}
 {{- if eq .Values.clusterProvider "ack" }}
 selector:
   matchLabels:
     alicloud-pvname: bold-fileserver
 {{- end }}
{{- end }}
{{- end }}