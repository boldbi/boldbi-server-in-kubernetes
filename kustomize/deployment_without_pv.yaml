apiVersion: apps/v1
kind: Deployment
metadata:
  name: bi-dataservice-deployment
  namespace: bold-services
spec:
  selector:
    matchLabels:
      app: bi-dataservice
  replicas: 1
  template:
    metadata:
      labels:
        app: bi-dataservice
    spec:
      initContainers:
      - name: id-web-initialization
        image: busybox:1.28
        command: ["/bin/sh","-c"]
        args: ["echo 'Waiting for id-web service...'; while ! nc -z id-web-service 6000; do echo 'Still waiting...'; sleep 5; done; echo 'id-web is ready'"]
      containers:
      - name: bi-dataservice-container
        image: us-docker.pkg.dev/boldbi-294612/boldbi/boldbi-designer:16.2.5
        ports:
        - containerPort: 80
        env:
        - name: INSTALL_OPTIONAL_LIBS
          value: "mongodb,mysql,influxdb,snowflake,oracle,clickhouse,google"
        - name: widget_bing_map_enable
          valueFrom:
            secretKeyRef:
              name: bold-secret
              key: widget_bing_map_enable_secret
        - name: widget_bing_map_api_key
          valueFrom:
            secretKeyRef:
              name: bold-secret
              key: widget_bing_map_api_key_secret
        - name: AppSettings__CustomSizePDFExport
          value: "true"
        - name: AppSettings__BrowserTimezone
          value: "true"
        - name: BOLD_SERVICES_HOSTING_ENVIRONMENT
          value: k8s
        - name: AppSettings__locale-path
          value: ""
        - name: AppSettings__EnableQueryMetricsInDebugFiles
          value: "false"
        - name: AppSettings__EnableQueryMetricsWithQueryInDebugFiles
          value: "false"
        - name: BOLD_SERVICES_PV_USED
          value: "false"
        envFrom:
        - secretRef:
            name: azure-blob-storage-secret
            optional: true
        - secretRef:
            name: oci-storage-secret
            optional: true
        - secretRef:
            name: aws-s3-storage-secret
            optional: true
        resources:
          requests:
            cpu: 250m
            memory: 750Mi
        readinessProbe:
          httpGet:
            path: /health-check
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /application/bi/dataservice/logs/k8s
          name: log4net-config-volume
      volumes:
      - name: log4net-config-volume
        configMap:
          name: log4net-config
---
