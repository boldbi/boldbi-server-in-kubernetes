# Use this file only when Upgrade Center is deployed with Azure Application Gateway for Containers.
# Update parentRefs to match the Gateway used by the main Bold BI HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bold-upgrade-center-route
  namespace: bold-services
spec:
  # hostnames:
  # - "example.com"
  parentRefs:
    - name: <gateway-name>
      namespace: <gateway-namespace>
      sectionName: <listener-name>
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /upgrade-center
    backendRefs:
    - name: bold-upgrade-center
      port: 80
