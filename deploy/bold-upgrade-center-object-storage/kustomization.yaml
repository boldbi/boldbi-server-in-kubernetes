apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bold-services
resources:
  - ../bold-upgrade-center
patches:
  - path: deployment-patch.yaml
  - target:
      kind: ConfigMap
      name: bold-upgrade-center-config
    patch: |-
      - op: replace
        path: /data/integrationMode
        value: Standalone
